name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGISTRY: registry.cn-guangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: zhisuaninfo
  RUNTIME_SOURCE: ghcr.io/david-crty/databasement-php@sha256:6494373e3ec937d7ec056a0ea708b3c95f0d166dce5cdb15d2cf609a7718fd86
  RUNTIME_TARGET: registry.cn-guangzhou.aliyuncs.com/zhisuaninfo/datacask-php:upstream-1.7.14-sha6494373
  NODE_SOURCE: public.ecr.aws/docker/library/node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
  NODE_TARGET: registry.cn-guangzhou.aliyuncs.com/zhisuaninfo/node:22-slim-sha83f487e
  POSTGRES_SOURCE: public.ecr.aws/docker/library/postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  POSTGRES_TARGET: registry.cn-guangzhou.aliyuncs.com/zhisuaninfo/postgres:17.11-alpine-sha18cfe3e

jobs:
  mirror-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Install Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Mirror dependency images
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          mirror_image() {
            local source_image="$1"
            local target_image="$2"
            echo "$(date --iso-8601=seconds) operation=mirror source=${source_image} target=${target_image} result=started"
            skopeo copy --all --retry-times 5 \
              "docker://${source_image}" "docker://${target_image}"
            skopeo inspect "docker://${target_image}" >/dev/null
            echo "$(date --iso-8601=seconds) operation=mirror source=${source_image} target=${target_image} result=completed"
          }

          printf '%s' "${ACR_PASSWORD}" | skopeo login \
            --username "${ACR_USERNAME}" --password-stdin "${ALIYUN_REGISTRY}"
          mirror_image "${RUNTIME_SOURCE}" "${RUNTIME_TARGET}"
          mirror_image "${NODE_SOURCE}" "${NODE_TARGET}"
          mirror_image "${POSTGRES_SOURCE}" "${POSTGRES_TARGET}"

  build-app-image:
    runs-on: ubuntu-latest
    needs: mirror-dependencies
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/datacask
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/datacask
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT_HASH=${{ github.sha }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
            BASE_IMAGE=${{ env.RUNTIME_TARGET }}
            NODE_IMAGE=${{ env.NODE_TARGET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish build summary
        run: |
          echo "### Datacask image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
