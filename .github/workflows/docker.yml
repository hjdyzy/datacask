name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'deploy/**'
      - 'helm/**'
      - 'LICENSE'
      - '.github/workflows/coverage-and-quality.yml'
      - '.github/workflows/dependencies.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/helm.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
    inputs:
      image_version_to_tag:
        description: Add a v-prefixed GHCR tag to an existing stable image (for example, 1.10.12)
        required: false
        type: string
      rebuild_base_image:
        description: Rebuild the runtime image even when its build context is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  ALIYUN_REGISTRY: registry.cn-guangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: zhisuaninfo
  NODE_IMAGE: registry.cn-guangzhou.aliyuncs.com/zhisuaninfo/datacask:base-node-22-slim-83f487e

jobs:
  tag-existing-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_version_to_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add version tag to existing manifest
        shell: bash
        env:
          VERSION: ${{ inputs.image_version_to_tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/datacask
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter an existing stable version such as 1.10.12"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")
          if existing_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:v$VERSION" 2>/dev/null); then
            if [[ "$existing_digest" != "$digest" ]]; then
              echo "::error::The version tag already points to another manifest"
              exit 1
            fi
          else
            docker buildx imagetools create --tag "$IMAGE:v$VERSION" "$IMAGE@$digest"
          fi
          tagged_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:v$VERSION")
          test "$digest" = "$tagged_digest"

  build-base-image:
    if: ${{ !inputs.image_version_to_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      base_image_tag: ${{ steps.base_image_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Resolve base image tag
        id: base_image_tag
        shell: bash
        run: |
          set -euo pipefail
          tree_hash="$(git rev-parse HEAD:docker/php)"
          tag="runtime-${tree_hash}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check for existing base image
        id: base_image_check
        shell: bash
        run: |
          set -euo pipefail
          image="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/datacask-php:${{ steps.base_image_tag.outputs.tag }}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate base image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/datacask-php
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/datacask-php
          tags: |
            type=raw,value=${{ steps.base_image_tag.outputs.tag }}

      - name: Build and push base image
        if: steps.base_image_check.outputs.exists != 'true' || inputs.rebuild_base_image
        uses: docker/build-push-action@v7
        with:
          context: docker/php
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish base image summary
        shell: bash
        run: |
          echo "### Datacask runtime image" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${{ steps.base_image_check.outputs.exists }}" != "true" || "${{ inputs.rebuild_base_image }}" == "true" ]]; then
            echo "Built and pushed from docker/php/:" >> "${GITHUB_STEP_SUMMARY}"
            echo '```text' >> "${GITHUB_STEP_SUMMARY}"
            echo "${{ steps.meta.outputs.tags }}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No runtime changes; using datacask-php:${{ steps.base_image_tag.outputs.tag }}." >> "${GITHUB_STEP_SUMMARY}"
          fi

  build-app-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-base-image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/datacask
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/datacask
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}},priority=850,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push application image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT_HASH=${{ github.sha }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
            BASE_IMAGE=${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/datacask-php:${{ needs.build-base-image.outputs.base_image_tag }}
            NODE_IMAGE=${{ env.NODE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify MySQL 5.6 dump client in application images
        timeout-minutes: 5
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/datacask@$IMAGE_DIGEST"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint mariadb-dump-10.6 "$image" --version
          done

      - name: Publish build summary
        run: |
          echo "### Datacask image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
